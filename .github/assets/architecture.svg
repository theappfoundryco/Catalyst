<svg xmlns="http://www.w3.org/2000/svg" width="960" height="400" viewBox="0 0 960 400" role="img" aria-labelledby="t d"><title id="t">How it fits together</title><desc id="d">You use the list, or scripts call commands directly. Commands read the machine the way a new terminal sees it. Every change is shown first and recorded, and only after a yes does anything go to the Trash, through sudo, or install a helper.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#8a8a8a" stroke-width="1.5"/></marker></defs><rect width="960" height="400" rx="12" fill="#161616"/><text x="40" y="38" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#8a8a8a" letter-spacing="1">YOU</text><text x="330" y="38" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#8a8a8a" letter-spacing="1">CATALYST, ON YOUR MACHINE</text><text x="720" y="38" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#8a8a8a" letter-spacing="1">ONLY AFTER A YES</text><rect x="310" y="52" width="360" height="316" rx="10" fill="none" stroke="#333333" stroke-dasharray="4 4"/><rect x="40" y="80" width="200" height="64" rx="8" fill="#222222" stroke="#444444"/><text x="140.0" y="109" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#f2f2f2">You at a terminal</text><text x="140.0" y="128" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#a8a8a8">one list, arrows and Enter</text><rect x="40" y="260" width="200" height="64" rx="8" fill="#222222" stroke="#444444"/><text x="140.0" y="289" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#f2f2f2">Scripts and CI</text><text x="140.0" y="308" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#a8a8a8">--json and exit codes</text><rect x="340" y="70" width="300" height="64" rx="8" fill="#222222" stroke="#444444"/><text x="490.0" y="99" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#f2f2f2">Commands</text><text x="490.0" y="118" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#a8a8a8">doctor, sweep, clean, system, ports...</text><rect x="340" y="170" width="300" height="64" rx="8" fill="#222222" stroke="#444444"/><text x="490.0" y="199" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#f2f2f2">Reads the machine</text><text x="490.0" y="218" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#a8a8a8">a new login shell, no network</text><rect x="340" y="270" width="300" height="64" rx="8" fill="#222222" stroke="#444444"/><text x="490.0" y="299" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#f2f2f2">Every change</text><text x="490.0" y="318" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#a8a8a8">shown first, then the journal</text><rect x="720" y="70" width="200" height="64" rx="8" fill="#222222" stroke="#444444"/><text x="820.0" y="99" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#f2f2f2">The Trash</text><text x="820.0" y="118" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#a8a8a8">Undo brings it back</text><rect x="720" y="170" width="200" height="64" rx="8" fill="#222222" stroke="#444444"/><text x="820.0" y="199" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#f2f2f2">sudo</text><text x="820.0" y="218" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#a8a8a8">asks for your password itself</text><rect x="720" y="270" width="200" height="64" rx="8" fill="#222222" stroke="#444444"/><text x="820.0" y="299" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#f2f2f2">Helpers</text><text x="820.0" y="318" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#a8a8a8">Homebrew, smartmontools</text><path d="M240 112L336 102" stroke="#8a8a8a" stroke-width="1.5" fill="none" marker-end="url(#a)"/><path d="M240 292L336 112" stroke="#8a8a8a" stroke-width="1.5" fill="none" marker-end="url(#a)"/><path d="M490 134L490 166" stroke="#8a8a8a" stroke-width="1.5" fill="none" marker-end="url(#a)"/><path d="M490 234L490 266" stroke="#8a8a8a" stroke-width="1.5" fill="none" marker-end="url(#a)"/><path d="M640 290L716 104" stroke="#8a8a8a" stroke-width="1.5" fill="none" marker-end="url(#a)"/><path d="M640 302L716 202" stroke="#8a8a8a" stroke-width="1.5" fill="none" marker-end="url(#a)"/><path d="M640 314L716 302" stroke="#8a8a8a" stroke-width="1.5" fill="none" marker-end="url(#a)"/></svg>
